<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Respiratory Autotexts</title>

<!-- A convenience shortcut, not a second copy of the site. The canonical home is
     autotexts.respiratorytrials.org; this exists so that carlreynolds.net/autotexts
     gets you there. noindex keeps it out of search results so the real site is the
     only one that appears. -->
<meta http-equiv="refresh" content="0; url=https://autotexts.respiratorytrials.org/">
<link rel="canonical" href="https://autotexts.respiratorytrials.org/">
<meta name="robots" content="noindex, follow">

<style>
  body {
    margin: 0;
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #14181b;
    background: #f0f2ee;
  }
  main { max-width: 32rem; margin: 14vh auto; padding: 0 1.25rem; }
  h1 { font-size: 1.3rem; letter-spacing: -0.02em; margin: 0 0 0.5rem; }
  p { color: #59636c; }
  a { color: #14554c; }
  code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.85em; background: #fff; border: 1px solid #e5e8e3;
    border-radius: 2px; padding: 0 0.25em;
  }
  .field {
    background: #fbe28c; color: #3d3005;
    border-bottom: 1px solid #e0bd4a; padding: 0 0.15em;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #11151a; color: #e4e8e6; }
    p { color: #94a0a8; }
    a { color: #63c9b5; }
    code { background: #181d23; border-color: #202730; }
    .field { background: #3a3213; color: #f0d489; border-bottom-color: #6d5c20; }
  }
</style>
</head>
<body>

<main>
  <h1>Respiratory <span class="field">[autotexts]</span></h1>
  <p>
    Taking you to <a href="https://autotexts.respiratorytrials.org/">autotexts.respiratorytrials.org</a>,
    which is where the site lives.
  </p>
  <p>
    If nothing happens, follow that link. Worth bookmarking the real address —
    <code>autotexts.respiratorytrials.org</code>.
  </p>
</main>

<script>
  // Runs before the meta refresh in practice, and replaces rather than pushes so
  // the back button returns where you came from instead of bouncing you forward
  // through this page again.
  location.replace('https://autotexts.respiratorytrials.org/');
</script>

</body>
</html>
